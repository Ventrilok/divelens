name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the change touches anything besides documentation.
  # The jobs below always run (main requires them by name) but skip their
  # steps when only documentation changed.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A pull request is checked out as a merge commit: its first parent
          # is the base branch. A push to main is compared with the previous tip.
          if [ "$EVENT" = pull_request ]; then base=HEAD^1; else base="$BEFORE"; fi
          if ! files=$(git diff --name-only "$base" HEAD); then
            echo "Cannot compare with $base: running every check."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$files"
          if echo "$files" | grep -qvE '^(docs/.*|.*\.md|LICENSE)$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation only: checks skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  core:
    name: Core tests (${{ matrix.os }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUN: ${{ needs.changes.outputs.code }}
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - if: env.RUN == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: env.RUN == 'true'
        run: cargo fmt --all --check
      - if: env.RUN == 'true'
        run: cargo clippy -p divelens-core -p libdivecomputer-sys --all-targets -- -D warnings
      - if: env.RUN == 'true'
        run: cargo test -p divelens-core

  # Checks and tests only: the release build happens when a version is published.
  app:
    name: App build (${{ matrix.os }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUN: ${{ needs.changes.outputs.code }}
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - if: env.RUN == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - if: env.RUN == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: env.RUN == 'true'
        run: npm ci
        working-directory: app
      - if: env.RUN == 'true'
        run: npm test
        working-directory: app
      # Type-checks the front end and produces app/dist, which the app crate embeds.
      - if: env.RUN == 'true'
        run: npm run build
        working-directory: app
      - if: env.RUN == 'true'
        run: cargo clippy -p divelens --all-targets -- -D warnings
      - if: env.RUN == 'true'
        run: cargo test -p divelens
