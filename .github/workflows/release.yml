name: Release

# Builds the package people download: the Lightroom plug-in folder
# (DiveLens.lrplugin) with the app inside, for macOS (Intel and Apple Silicon)
# and Windows, each as an installer and as a zip. The installers put the
# folder in the current user's Lightroom Modules folder, where Lightroom loads
# it by itself (packaging/); the zip is for installing by hand. The plug-in
# finds the app next to its own files (plugin/DiveLens.lrdevplugin/Launch.lua).
#
# - A pull request that changes this workflow or the packaging builds the
#   package as a test: the files are kept as run artifacts, nothing is
#   published.
# - Pushing a version tag (v2.0.0) builds it and attaches it to a DRAFT
#   GitHub release; the owner reviews and publishes it by hand.
#
# Signing (spec, section 9): the macOS app is signed with the owner's
# Developer ID and notarized by Apple, so it opens without a warning. The
# certificates and the notarization key come from the repository's secrets;
# they are never available to a pull request from a fork, which gets an
# ad-hoc signature instead (a version tag always requires them). The Windows
# app is not signed yet.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**
      - app/src-tauri/tauri.conf.json
      - plugin/DiveLens.lrdevplugin/Launch.lua
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Read the version
        id: version
        run: |
          version=$(node -p "require('./app/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A release tag must name the version the package carries.
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app/package.json version $version (expected v$version)."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.name == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release

      - run: npm ci
        working-directory: app

      # A keychain of its own for this run, holding the two Developer ID
      # certificates (Application signs the app, Installer the .pkg) and
      # Apple's intermediate certificate that makes them valid. Tauri signs
      # and notarizes the app with the identity and the API key it is given.
      - name: Prepare signing (macOS)
        id: signing
        if: matrix.name == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "::error::A release needs the signing secrets."
              exit 1
            fi
            echo "::warning::No signing secrets (pull request from a fork?): ad-hoc signature only."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "app-identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          # Apple's Developer ID G2 intermediate, checked against its known
          # fingerprint: the certificates were issued under it.
          curl -sSfL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          fingerprint=$(openssl x509 -inform DER -in "$RUNNER_TEMP/DeveloperIDG2CA.cer" -noout -fingerprint -sha256 | cut -d= -f2)
          if [ "$fingerprint" != "F1:6C:D3:C5:4C:7F:83:CE:A4:BF:1A:3E:6A:08:19:C8:AA:A8:E4:A1:52:8F:D1:44:71:5F:35:06:43:D2:DF:3A" ]; then
            echo "::error::Unexpected Developer ID G2 certificate: $fingerprint"
            exit 1
          fi
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"

          import_p12() {
            printf '%s' "$1" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$2" \
              -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
            rm -f "$RUNNER_TEMP/cert.p12"
          }
          import_p12 "$APPLE_CERTIFICATE" "$APPLE_CERTIFICATE_PASSWORD"
          import_p12 "$APPLE_INSTALLER_CERTIFICATE" "$APPLE_INSTALLER_CERTIFICATE_PASSWORD"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          identity() {
            security find-identity -v -p "$1" "$keychain" | sed -n "s/.*\"\(Developer ID $2: .*\)\"/\1/p" | head -n 1
          }
          app_identity=$(identity codesigning Application)
          installer_identity=$(identity basic Installer)
          if [ -z "$app_identity" ] || [ -z "$installer_identity" ]; then
            security find-identity -v "$keychain"
            echo "::error::The Developer ID certificates are not valid in the signing keychain."
            exit 1
          fi
          echo "Signing as: $app_identity / $installer_identity"

          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "signed=true"
            echo "keychain=$keychain"
            echo "app-identity=$app_identity"
            echo "installer-identity=$installer_identity"
          } >> "$GITHUB_OUTPUT"
          # Read by Tauri to notarize the app, and by the .pkg step.
          {
            echo "APPLE_API_KEY=$APPLE_API_KEY"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
          } >> "$GITHUB_ENV"

      - name: Build the app (macOS, Intel and Apple Silicon)
        if: matrix.name == 'macOS'
        working-directory: app
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.signing.outputs.app-identity }}
        run: npm run tauri build -- --target universal-apple-darwin --bundles app

      - name: Build the app (Windows)
        if: matrix.name == 'Windows'
        working-directory: app
        run: npm run tauri build -- --no-bundle

      - name: Assemble the plug-in folder
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          out=package/DiveLens.lrplugin
          mkdir -p "$out"
          cp plugin/DiveLens.lrdevplugin/* "$out/"
          cp LICENSE "$out/"
          if [ "${{ matrix.name }}" = macOS ]; then
            # ditto keeps the signed, notarized bundle exactly as it is.
            ditto "target/universal-apple-darwin/release/bundle/macos/Dive Lens.app" "$out/Dive Lens.app"
          else
            cp target/release/divelens.exe "$out/Dive Lens.exe"
          fi
          ls -la "$out"

      - name: Check the app (macOS)
        if: matrix.name == 'macOS'
        run: |
          app="package/DiveLens.lrplugin/Dive Lens.app"
          bin="$app/Contents/MacOS/$(defaults read "$PWD/$app/Contents/Info" CFBundleExecutable)"
          archs=$(lipo -archs "$bin")
          echo "Architectures: $archs"
          case "$archs" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "::error::Not a universal app: $archs"; exit 1 ;; esac
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E "Identifier|Signature|Format|Authority|TeamIdentifier"
          if [ "${{ steps.signing.outputs.signed }}" = true ]; then
            # Notarized, with Apple's ticket attached, and accepted by
            # Gatekeeper as a diver's Mac would check it.
            xcrun stapler validate "$app"
            assessment=$(spctl --assess --type exec -vv "$app" 2>&1)
            echo "$assessment"
            case "$assessment" in
              *"source=Notarized Developer ID"*) ;;
              *) echo "::error::Gatekeeper does not accept the app as notarized."; exit 1 ;;
            esac
          fi

      - name: Zip (macOS)
        if: matrix.name == 'macOS'
        working-directory: package
        # ditto keeps the app bundle as macOS expects it (links, permissions,
        # signature); plain zip can break it.
        run: ditto -c -k --keepParent DiveLens.lrplugin "DiveLens-${{ steps.version.outputs.version }}-macOS.zip"

      - name: Zip (Windows)
        if: matrix.name == 'Windows'
        working-directory: package
        shell: pwsh
        run: Compress-Archive -Path DiveLens.lrplugin -DestinationPath "DiveLens-${{ steps.version.outputs.version }}-Windows.zip"

      # Signed with the Developer ID Installer certificate, notarized, with
      # Apple's ticket attached. Without the signing secrets there is no
      # installer (pull request from a fork).
      - name: Installer (macOS)
        if: matrix.name == 'macOS' && steps.signing.outputs.signed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IDENTITY: ${{ steps.signing.outputs.installer-identity }}
        run: |
          pkg="package/DiveLens-$VERSION-macOS.pkg"
          packaging/macos/build-pkg.sh package/DiveLens.lrplugin "$VERSION" "$pkg" "$IDENTITY"
          pkgutil --check-signature "$pkg"

          # Submit, then wait: Apple's first submissions of a new kind can take
          # well over half an hour. The status is read once the wait ends,
          # whatever ended it.
          auth=(--key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER")
          submission=$(xcrun notarytool submit "$pkg" "${auth[@]}" --output-format json | plutil -extract id raw -o - -)
          echo "Notarization submission: $submission"
          xcrun notarytool wait "$submission" "${auth[@]}" --timeout 2h || true
          status=$(xcrun notarytool info "$submission" "${auth[@]}" --output-format json | plutil -extract status raw -o - -)
          echo "Notarization status: $status"
          if [ "$status" != Accepted ]; then
            xcrun notarytool log "$submission" "${auth[@]}" || true
            echo "::error::Apple did not notarize the installer (status: $status)."
            exit 1
          fi
          xcrun stapler staple "$pkg"
          xcrun stapler validate "$pkg"
          assessment=$(spctl --assess --type install -vv "$pkg" 2>&1)
          echo "$assessment"
          case "$assessment" in
            *"source=Notarized Developer ID"*) ;;
            *) echo "::error::Gatekeeper does not accept the installer as notarized."; exit 1 ;;
          esac

      - name: Try the installer (macOS)
        if: matrix.name == 'macOS' && steps.signing.outputs.signed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          installer -pkg "package/DiveLens-$VERSION-macOS.pkg" -target CurrentUserHomeDirectory
          plugin="$HOME/Library/Application Support/Adobe/Lightroom/Modules/DiveLens.lrplugin"
          ls -la "$plugin"
          test -f "$plugin/Info.lua"
          codesign --verify --deep --strict "$plugin/Dive Lens.app"
          # Owned by the user, so that an update can replace it without a password.
          owner=$(stat -f %Su "$plugin/Dive Lens.app")
          if [ "$owner" != "$(id -un)" ]; then
            echo "::error::Installed files belong to $owner, not to the user."
            exit 1
          fi

      - name: Installer (Windows)
        if: matrix.name == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source }
          # Windows' numeric file version takes the version without its label.
          $numeric = ($env:VERSION -split '-')[0]
          & $iscc "/DVersion=$env:VERSION" "/DNumericVersion=$numeric" `
            "/DPluginDir=$PWD\package\DiveLens.lrplugin" "/DOutputDir=$PWD\package" `
            packaging\windows\divelens.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Try the installer (Windows)
        if: matrix.name == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $setup = "package\DiveLens-$env:VERSION-Windows-Setup.exe"
          Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $plugin = Join-Path $env:APPDATA 'Adobe\Lightroom\Modules\DiveLens.lrplugin'
          Get-ChildItem $plugin
          foreach ($file in 'Info.lua', 'Dive Lens.exe') {
            if (-not (Test-Path (Join-Path $plugin $file))) { Write-Error "$file was not installed"; exit 1 }
          }
          $uninstaller = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Dive Lens\Uninstall') -Filter 'unins*.exe' | Select-Object -First 1
          # The uninstaller relaunches itself from a temporary copy and returns
          # at once: wait for the app to be gone.
          Start-Process -FilePath $uninstaller.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $app = Join-Path $plugin 'Dive Lens.exe'
          for ($i = 0; $i -lt 60 -and (Test-Path $app); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $app) { Write-Error 'The uninstaller left the app'; exit 1 }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DiveLens-${{ matrix.name }}
          path: |
            package/DiveLens-*.zip
            package/DiveLens-*.pkg
            package/DiveLens-*-Setup.exe
          if-no-files-found: error

      - name: Remove the signing keychain (macOS)
        if: always() && steps.signing.outputs.signed == 'true'
        run: |
          security delete-keychain "${{ steps.signing.outputs.keychain }}" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

  release:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Dive Lens ${TAG#v}" \
            --generate-notes
