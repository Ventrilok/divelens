[package]
name = "divelens"
description = "DiveLens desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (Windows issue,
# see https://github.com/rust-lang/cargo/issues/8519).
name = "divelens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
divelens-core = { path = "../../core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

[dev-dependencies]
# Runs the plugin's pure-Lua modules under Lua 5.1, the version Lightroom embeds.
mlua = { version = "0.12", features = ["lua51", "vendored"] }
