[package]
name = "divelens-core"
description = "Dive Lens core: common dive format and dive-log readers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
libdivecomputer-sys = { path = "../libdivecomputer-sys" }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
gix = { version = "0.90", default-features = false, features = ["sha1"] }
quick-xml = "0.42"
# Time zones of MacDive dives, built in: the same on every system.
chrono-tz = "0.10.4"
# MacDive archives each dive's time zone as a binary property list.
plist = { version = "1.10.3", default-features = false }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
