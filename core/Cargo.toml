[package]
name = "divelens-core"
description = "DiveLens core: common dive format and dive-log readers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
libdivecomputer-sys = { path = "../libdivecomputer-sys" }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
